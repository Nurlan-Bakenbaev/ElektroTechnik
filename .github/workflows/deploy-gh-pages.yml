name: Deploy static Next.js site to GitHub Pages

on:
  push:
    branches:
      - nurlan-bakenbaev-review-teaching-german
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Export static HTML
        run: npx next export -o out

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_branch: gh-pages
          publish_dir: ./out
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # prevent commit from action from being attributed to GITHUB_ACTOR if desired
          # user_name: github-actions
          # user_email: action@github.com
